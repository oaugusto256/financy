query Me {
  me {
    id
    name
    email
    createdAt
  }
}

mutation SignIn($input: SignInInput!) {
  signIn(input: $input) {
    token
    user {
      id
      name
      email
      createdAt
    }
  }
}

mutation SignUp($input: SignUpInput!) {
  signUp(input: $input) {
    token
    user {
      id
      name
      email
      createdAt
    }
  }
}

mutation UpdateProfile($input: UpdateProfileInput!) {
  updateProfile(input: $input) {
    id
    name
    email
    createdAt
  }
}
