# totalAmount is selected for the dashboard's "Categorias" panel, which sorts by
# it. The categories page's card shows an item count and no money and simply
# does not read it — one document rather than two, because a second document is
# a second cache entry for the same rows and the mutations invalidate by
# operation name.
query Categories {
  categories {
    id
    name
    description
    icon
    color
    transactionCount
    totalAmount
  }
}

query CategoryStats {
  categoryStats {
    totalCategories
    totalTransactions
    mostUsed {
      id
      name
      icon
      color
    }
  }
}

# The mutations ask for the id and nothing else. The lists are refetched through
# explicit invalidation, so selecting more fields here would only produce a
# second copy of the same data that nothing reads.
mutation CreateCategory($input: CreateCategoryInput!) {
  createCategory(input: $input) {
    id
  }
}

mutation UpdateCategory($id: ID!, $input: UpdateCategoryInput!) {
  updateCategory(id: $id, input: $input) {
    id
  }
}

mutation DeleteCategory($id: ID!) {
  deleteCategory(id: $id)
}
