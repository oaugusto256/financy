type AuthPayload {
  token: String!
  user: User!
}

type Category {
  color: CategoryColor!
  createdAt: DateTime!
  description: String
  icon: CategoryIcon!
  id: ID!
  name: String!
  totalAmount: Int!
  transactionCount: Int!
  updatedAt: DateTime!
}

enum CategoryColor {
  BLUE
  GREEN
  ORANGE
  PINK
  PURPLE
  RED
  YELLOW
}

enum CategoryIcon {
  BIKE
  BOOK_OPEN
  BRIEFCASE
  BUS
  CREDIT_CARD
  GIFT
  HAND_COINS
  HEART_PULSE
  HOME
  PIGGY_BANK
  RECEIPT
  SHOPPING_CART
  STORE
  TICKET
  UTENSILS
  WALLET
}

type CategoryStats {
  mostUsed: Category
  totalCategories: Int!
  totalTransactions: Int!
}

input CreateCategoryInput {
  color: CategoryColor!
  description: String
  icon: CategoryIcon!
  name: String!
}

input CreateTransactionInput {
  amount: Int!
  categoryId: ID
  date: DateTime!
  description: String!
  type: TransactionType!
}

scalar DateTime

type Mutation {
  createCategory(input: CreateCategoryInput!): Category!
  createTransaction(input: CreateTransactionInput!): Transaction!
  deleteCategory(id: ID!): Boolean!
  deleteTransaction(id: ID!): Boolean!
  signIn(input: SignInInput!): AuthPayload!
  signUp(input: SignUpInput!): AuthPayload!
  updateCategory(id: ID!, input: UpdateCategoryInput!): Category!
  updateProfile(input: UpdateProfileInput!): User!
  updateTransaction(id: ID!, input: UpdateTransactionInput!): Transaction!
}

type Query {
  categories: [Category!]!
  categoryStats: CategoryStats!
  health: String!
  me: User!

  """The month window is built in UTC. backend.md section 5."""
  summary(month: Int!, year: Int!): Summary!
  transactions(filter: TransactionFilter, limit: Int = 10, offset: Int = 0): TransactionPage!
}

input SignInInput {
  email: String!
  password: String!
}

input SignUpInput {
  email: String!
  name: String!
  password: String!
}

type Summary {
  """Expense within the requested month, in cents, unsigned."""
  monthExpense: Int!

  """Income within the requested month, in cents."""
  monthIncome: Int!

  """All-time income minus expense, in cents. Can be negative."""
  totalBalance: Int!
}

type Transaction {
  amount: Int!
  category: Category
  createdAt: DateTime!
  date: DateTime!
  description: String!
  id: ID!
  type: TransactionType!
  updatedAt: DateTime!
}

input TransactionFilter {
  categoryId: ID

  """Inclusive lower bound on the transaction's own date."""
  dateFrom: DateTime

  """Inclusive upper bound."""
  dateTo: DateTime

  """Case-insensitive substring of the description."""
  search: String
  type: TransactionType
}

type TransactionPage {
  items: [Transaction!]!
  totalCount: Int!
}

enum TransactionType {
  EXPENSE
  INCOME
}

input UpdateCategoryInput {
  color: CategoryColor
  description: String
  icon: CategoryIcon
  name: String
}

input UpdateProfileInput {
  name: String!
}

input UpdateTransactionInput {
  amount: Int
  categoryId: ID
  date: DateTime
  description: String
  type: TransactionType
}

type User {
  createdAt: DateTime!
  email: String!
  id: ID!
  name: String!
}